<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SysPulse Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div>
            <h1>SysPulse</h1>
            <p>Linux / system monitoring dashboard</p>
        </div>
        <div id="refresh-status" class="small">Loading...</div>
    </header>

    <main>
        <section class="summary-grid">
            <div class="summary-card">
                <p>Total Machines</p>
                <h2 id="total-machines">-</h2>
            </div>

            <div class="summary-card">
                <p>Online Machines</p>
                <h2 id="online-machines">-</h2>
            </div>

            <div class="summary-card">
                <p>Active Alerts</p>
                <h2 id="active-alerts">-</h2>
            </div>

            <div class="summary-card">
                <p>Avg CPU</p>
                <h2 id="avg-cpu">-</h2>
            </div>

            <div class="summary-card">
                <p>Avg RAM</p>
                <h2 id="avg-ram">-</h2>
            </div>

            <div class="summary-card">
                <p>Avg Disk</p>
                <h2 id="avg-disk">-</h2>
            </div>
        </section>

        <section class="grid">
            <div class="card">
                <h2>Machines</h2>
                <div id="machines">Loading...</div>
            </div>

            <div class="card">
                <h2>Latest Metrics</h2>
                <div id="latest-metrics">Loading...</div>
            </div>

            <div class="card">
                <h2>Alerts</h2>
                <div id="alerts">Loading...</div>
            </div>
        </section>

        <section class="card full-width">
            <h2>Metrics History</h2>
            <div id="metrics-history">Loading...</div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
