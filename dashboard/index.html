<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SysPulse Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>SysPulse</h1>
        <p>Linux / system monitoring dashboard</p>
    </header>

    <main>
        <section class="grid">
            <div class="card">
                <h2>Machines</h2>
                <div id="machines">Loading...</div>
            </div>

            <div class="card">
                <h2>Latest Metrics</h2>
                <div id="latest-metrics">Loading...</div>
            </div>

            <div class="card">
                <h2>Alerts</h2>
                <div id="alerts">Loading...</div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
